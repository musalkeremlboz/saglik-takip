<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: çentik/alt çubuk için safe-area çalışsın -->
    <!-- maximum-scale + user-scalable: iOS input zoom'unu engeller -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS standalone (Ana Ekrana Ekle) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sağlık" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Sağlık Takip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
